[[headers]]
  for = "/*"
  [headers.values]
    # Block site from being embedded in iframes (Prevent Clickjacking)
    X-Frame-Options = "DENY"
    
    # Prevent browser from guessing content types (MIME Sniffing protection)
    X-Content-Type-Options = "nosniff"
    
    # Force usage of HTTPS (HSTS) - 1 year max-age
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Control how much referrer information is sent to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Content Security Policy (CSP) - The big shield against XSS
    # - Default: Only allow content from own site
    # - Images: Allow own site + CartoDB (for map) + data URIs
    # - Styles: Allow own site + inline styles (needed for markers/js dynamic styles)
    # - Scripts: Allow own site + blob (for map workers)
    # - Connect: Allow fetch to own site + CartoDB
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://a.basemaps.cartocdn.com; style-src 'self' 'unsafe-inline'; script-src 'self' blob:; connect-src 'self' https://a.basemaps.cartocdn.com; worker-src blob:; object-src 'none'; frame-ancestors 'none';"
    
    # Basic permissions policy
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
